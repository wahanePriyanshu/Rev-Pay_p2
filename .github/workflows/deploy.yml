name: RevPay CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend
        run: |
          cd backend/rev_pay_p2
          docker build -t ${{ secrets.DOCKER_USERNAME }}/revpay-backend:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/revpay-backend:latest

      - name: Build and Push Frontend
        run: |
          cd frontend/revpay-frontend
          docker build -t ${{ secrets.DOCKER_USERNAME }}/revpay-frontend:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/revpay-frontend:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/revpay
            docker compose pull
            docker compose up -d